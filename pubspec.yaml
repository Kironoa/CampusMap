name: naviapp
description: "A specialized campus navigation app with AI assistance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  provider: ^6.1.1

  # Data
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.2.1

  # AI API
  http: ^1.2.1
  flutter_tts: ^4.2.5

  # BLE indoor positioning + QR scanning
  permission_handler: ^11.3.1
  flutter_blue_plus: ^2.3.12
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  haptic_feedback: ^0.6.5
  flutter_staggered_animations: ^1.1.1
  geolocator: ^14.1.1
  maplibre: ^0.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Tool to change the physical app icon on the phone
  flutter_launcher_icons: ^0.13.1 

# Configuration for the App Logo
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo and icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/ground_floor.png
    - assets/images/second_floor.png
    - assets/images/third_floor.png
    - assets/images/logo and icon.png
    - assets/Main Building.jpg
    - assets/Annex Building.jpg
    - assets/Tangub Asenso Building.jpg

    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300