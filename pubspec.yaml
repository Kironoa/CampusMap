name: naviapp
description: "A specialized campus navigation app with real-time tracking and AI assistance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  path: ^1.9.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  supabase_flutter: ^2.12.2
  sqflite: ^2.3.3+2
  file_picker: ^11.0.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.0.7
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  google_generative_ai: ^0.4.7
  flip_card: ^0.7.0
  connectivity_plus: ^6.0.3
  dio: ^5.4.0
  flutter_dotenv: ^5.2.1
  crypto: ^3.0.3

  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  flutter_polyline_points: ^2.0.0
  
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0+2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300