name: naviapp
description: "A specialized campus navigation app with AI assistance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  provider: ^6.1.1

  # Data
  shared_preferences: ^2.3.2 # Updated for better stability
  flutter_dotenv: ^5.2.1

  # AI API
  http: ^1.2.1 # Updated to latest

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # Updated for latest coding standards

flutter:
  uses-material-design: true

  # FIXED: Removed the redundant 'assets:' key under the flutter section
  assets:
    - assets/images/ground_floor.png
    - assets/images/second_floor.png
    - assets/images/third_floor.png
    - assets/images/splogo.jpg
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300