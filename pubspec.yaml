name: mobile_app
description: "Student Pal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  path: ^1.9.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  supabase_flutter: ^2.6.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+2
  file_picker: ^11.0.0 
  open_filex: ^4.7.0 
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.0.7
  provider: ^6.1.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/splogo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/splogo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/